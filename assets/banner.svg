<svg width="100%" height="240" viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Deep Space Gradient -->
    <linearGradient id="ashishBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814" />
      <stop offset="45%" stop-color="#081426" />
      <stop offset="85%" stop-color="#0B1A33" />
      <stop offset="100%" stop-color="#03060D" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Rainbow Circuit Gradient -->
    <linearGradient id="orbitRainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="30%" stop-color="#8B5CF6" />
      <stop offset="60%" stop-color="#EC4899" />
      <stop offset="85%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Metallic Shimmer Text Gradient -->
    <linearGradient id="shimmerTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#F0F9FF" />
      <stop offset="65%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseSoft {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.06); }
    }
    @keyframes scanAcross {
      0% { transform: translateX(-350px); }
      100% { transform: translateX(1150px); }
    }
    @keyframes spinCW {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCCW {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes floatCluster {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes radarPing {
      0% { r: 3; opacity: 1; }
      100% { r: 15; opacity: 0; }
    }
    @keyframes dataStream {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes titleGleam {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(0, 242, 254, 0.4)); }
      50% { filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.95)); }
    }
    @keyframes badgeAura {
      0%, 100% { stroke-opacity: 0.6; }
      50% { stroke-opacity: 1; }
    }

    .hero-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 40px;
      letter-spacing: 4px;
      fill: url(#shimmerTitle);
      animation: titleGleam 4s ease-in-out infinite;
    }
    .hero-title {
      font-family: 'Fira Code', 'SF Mono', Consolas, monospace;
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: 700;
      fill: #38BDF8;
    }
    .hero-tags {
      font-family: 'Fira Code', 'SF Mono', Consolas, monospace;
      font-size: 10.5px;
      fill: #94A3B8;
      letter-spacing: 1px;
    }
    .top-telemetry {
      font-family: 'Fira Code', monospace;
      font-size: 9.5px;
      font-weight: 700;
      fill: #10B981;
      letter-spacing: 1.2px;
    }
    .anim-spin-cw {
      animation: spinCW 14s linear infinite;
      transform-origin: 820px 100px;
    }
    .anim-spin-ccw {
      animation: spinCCW 8s linear infinite;
      transform-origin: 820px 100px;
    }
    .float-anim {
      animation: floatCluster 4.5s ease-in-out infinite;
    }
    .glow-anim {
      animation: pulseSoft 3s ease-in-out infinite;
      transform-origin: center;
    }
    .laser-scan {
      animation: scanAcross 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .circuit-data {
      stroke-dasharray: 20 60;
      animation: dataStream 3s linear infinite;
    }
    .ping-circle {
      animation: radarPing 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    .badge-pulse {
      animation: badgeAura 3s ease-in-out infinite;
    }
  </style>

  <!-- Card Border & Background -->
  <rect x="2" y="2" width="996" height="236" rx="16" fill="url(#ashishBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Background Grid Lines -->
  <g stroke="#1E293B" stroke-width="0.75" opacity="0.4">
    <line x1="30" y1="35" x2="970" y2="35" />
    <line x1="30" y1="80" x2="970" y2="80" />
    <line x1="30" y1="125" x2="970" y2="125" />
    <line x1="30" y1="170" x2="970" y2="170" />
    
    <line x1="80" y1="20" x2="80" y2="220" />
    <line x1="300" y1="20" x2="300" y2="220" />
    <line x1="560" y1="20" x2="560" y2="220" />
    <line x1="720" y1="20" x2="720" y2="220" />
    <line x1="930" y1="20" x2="930" y2="220" />
  </g>

  <!-- Flowing Circuit Data Stream Packets -->
  <g stroke="#00F2FE" stroke-width="1.2" opacity="0.6">
    <line x1="30" y1="80" x2="720" y2="80" class="circuit-data" />
    <line x1="80" y1="35" x2="80" y2="170" class="circuit-data" />
    <line x1="300" y1="35" x2="300" y2="170" class="circuit-data" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="220" cy="50" r="110" fill="#00F2FE" opacity="0.08" filter="url(#intenseGlow)" class="glow-anim" />
  <circle cx="820" cy="100" r="130" fill="#8B5CF6" opacity="0.12" filter="url(#intenseGlow)" class="glow-anim" />
  <circle cx="820" cy="100" r="80" fill="#00F2FE" opacity="0.1" filter="url(#softGlow)" class="glow-anim" />

  <!-- Animated Dual Laser Scanner Beam -->
  <g class="laser-scan">
    <line x1="0" y1="15" x2="0" y2="225" stroke="#00F2FE" stroke-width="2" opacity="0.75" filter="url(#softGlow)" />
    <line x1="-8" y1="15" x2="-8" y2="225" stroke="#EC4899" stroke-width="1" opacity="0.4" />
  </g>

  <!-- High-Tech Corner Brackets -->
  <path d="M 18 36 L 18 18 L 36 18" stroke="#00F2FE" stroke-width="2.2" fill="none" />
  <path d="M 982 36 L 982 18 L 964 18" stroke="#00F2FE" stroke-width="2.2" fill="none" />
  <path d="M 18 204 L 18 222 L 36 222" stroke="#00F2FE" stroke-width="2.2" fill="none" />
  <path d="M 982 204 L 982 222 L 964 222" stroke="#00F2FE" stroke-width="2.2" fill="none" />

  <!-- Top Telemetry Header with Animated Radar Ping -->
  <g transform="translate(48, 24)">
    <circle cx="5" cy="5" r="4" fill="#10B981" />
    <circle cx="5" cy="5" r="5" stroke="#10B981" stroke-width="1.5" class="ping-circle" fill="none" />
    <text x="22" y="8.5" class="top-telemetry">10+ YRS IT EXP // 5+ YRS CLOUD, DEVOPS &amp; DEVSECOPS SPECIALIST // RELIANCE INDUSTRIES</text>
    <text x="890" y="8.5" font-family="'Fira Code', monospace" font-size="9.5" fill="#64748B" text-anchor="end">SYS.STATUS: ONLINE</text>
  </g>

  <!-- Main Hero Profile Info -->
  <g transform="translate(52, 90)">
    <text x="0" y="0" class="hero-name">ASHISH PANDEY</text>
    <text x="2" y="30" class="hero-title">SENIOR DEVOPS ENGINEER @ RELIANCE INDUSTRIES</text>
    <text x="2" y="55" class="hero-tags">AZURE CLOUD &#8226; TERRAFORM MODULAR IaC &#8226; CI/CD GITOPS &#8226; DEVSECOPS &#8226; KUBERNETES</text>
  </g>

  <!-- ======================================================== -->
  <!-- ANIMATED MULTI-RING TECH CLUSTER ARTWORK (RIGHT SIDE)   -->
  <!-- ======================================================== -->
  <g>
    <!-- Outer Orbit Rainbow Ring (Clockwise) -->
    <circle cx="820" cy="100" r="66" stroke="url(#orbitRainbow)" stroke-width="2.2" stroke-dasharray="14 8 28 8" opacity="0.85" class="anim-spin-cw" filter="url(#softGlow)" />

    <!-- Middle Cyan Gear Ring (Counter-Clockwise) -->
    <circle cx="820" cy="100" r="50" stroke="#00F2FE" stroke-width="1.8" stroke-dasharray="10 8" opacity="0.75" class="anim-spin-ccw" />

    <!-- Center Floating Platform with Isometric Cloud -->
    <g transform="translate(820, 100)" class="float-anim">
      <!-- Hexagonal Core Base -->
      <polygon points="0,-36 34,-18 34,18 0,36 -34,18 -34,-18" fill="#0C1A30" stroke="url(#neonGradient)" stroke-width="2" filter="url(#softGlow)" />

      <!-- Cloud Icon Symbol -->
      <path d="M-13,5 C-16,5 -18,3 -18,0 C-18,-3 -16,-5 -13,-5 C-13,-8 -10,-11 -6,-11 C-2,-11 1,-9 2,-6 C4,-7 7,-7 9,-5 C11,-3 11,0 10,2 C12,3 13,5 13,7 C13,10 10,12 7,12 L-12,12 C-15,12 -17,10 -17,7" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Orbiting Satellite 1: Top (Terraform) -->
      <g transform="translate(0, -56)">
        <circle cx="0" cy="0" r="12" fill="#0B132B" stroke="#00F2FE" stroke-width="1.5" />
        <polygon points="-4,-3 0,-6 4,-3 0,-1" fill="#38BDF8" />
        <polygon points="-4,1 0,-1 4,1 0,3" fill="#818CF8" />
        <polygon points="-4,5 0,3 4,5 0,7" fill="#00F2FE" />
      </g>

      <!-- Orbiting Satellite 2: Right (Azure) -->
      <g transform="translate(56, 0)">
        <circle cx="0" cy="0" r="12" fill="#0B132B" stroke="#10B981" stroke-width="1.5" />
        <path d="M-4,3 L-1,-4 L2,-1 L-2,3 Z" fill="#10B981" />
        <path d="M0,0 L2,-1 L5,3 L-2,3 Z" fill="#059669" />
      </g>

      <!-- Orbiting Satellite 3: Bottom (Kubernetes) -->
      <g transform="translate(0, 56)">
        <circle cx="0" cy="0" r="12" fill="#0B132B" stroke="#8B5CF6" stroke-width="1.5" />
        <circle cx="0" cy="0" r="4" stroke="#8B5CF6" stroke-width="1.5" fill="none" />
        <line x1="0" y1="-8" x2="0" y2="-4" stroke="#8B5CF6" stroke-width="1.5" />
        <line x1="0" y1="4" x2="0" y2="8" stroke="#8B5CF6" stroke-width="1.5" />
        <line x1="-7" y1="-4" x2="-3.5" y2="-2" stroke="#8B5CF6" stroke-width="1.5" />
        <line x1="3.5" y1="2" x2="7" y2="4" stroke="#8B5CF6" stroke-width="1.5" />
      </g>

      <!-- Orbiting Satellite 4: Left (CI/CD GitOps) -->
      <g transform="translate(-56, 0)">
        <circle cx="0" cy="0" r="12" fill="#0B132B" stroke="#F59E0B" stroke-width="1.5" />
        <circle cx="-3" cy="3" r="2" fill="#F59E0B" />
        <circle cx="3" cy="-3" r="2" fill="#38BDF8" />
        <line x1="-3" y1="3" x2="3" y2="-3" stroke="#FFFFFF" stroke-width="1" />
      </g>
    </g>
  </g>

  <!-- Glowing Neon Separator Line -->
  <line x1="48" y1="170" x2="952" y2="170" stroke="url(#neonGradient)" stroke-width="1.5" filter="url(#softGlow)" />

  <!-- Bottom Metric Telemetry Pills with Glow -->
  <g transform="translate(48, 188)">
    <!-- Pill 1: 10+ Yrs IT -->
    <rect x="0" y="0" width="165" height="30" rx="6" fill="url(#badgeGrad)" stroke="#38BDF8" stroke-width="1" class="badge-pulse" />
    <circle cx="14" cy="15" r="3.5" fill="#38BDF8" />
    <text x="26" y="19" font-family="'Fira Code', monospace" font-size="10" fill="#F1F5F9" font-weight="700">10+ YRS IT EXP</text>

    <!-- Pill 2: 5+ Yrs Cloud/DevOps -->
    <rect x="180" y="0" width="195" height="30" rx="6" fill="url(#badgeGrad)" stroke="#10B981" stroke-width="1" class="badge-pulse" />
    <circle cx="195" cy="15" r="3.5" fill="#10B981" />
    <text x="207" y="19" font-family="'Fira Code', monospace" font-size="10" fill="#F1F5F9" font-weight="700">5+ YRS CLOUD/DEVOPS</text>

    <!-- Pill 3: 60% Effort Reduction -->
    <rect x="390" y="0" width="185" height="30" rx="6" fill="url(#badgeGrad)" stroke="#818CF8" stroke-width="1" class="badge-pulse" />
    <circle cx="405" cy="15" r="3.5" fill="#818CF8" />
    <text x="417" y="19" font-family="'Fira Code', monospace" font-size="10" fill="#F1F5F9" font-weight="700">60% EFFORT CUT</text>

    <!-- Pill 4: 99.9% Uptime -->
    <rect x="590" y="0" width="160" height="30" rx="6" fill="url(#badgeGrad)" stroke="#F59E0B" stroke-width="1" class="badge-pulse" />
    <circle cx="605" cy="15" r="3.5" fill="#F59E0B" />
    <text x="617" y="19" font-family="'Fira Code', monospace" font-size="10" fill="#F1F5F9" font-weight="700">99.9% UPTIME</text>

    <!-- Pill 5: Reliance Jio POS -->
    <rect x="765" y="0" width="170" height="30" rx="6" fill="url(#badgeGrad)" stroke="#06B6D4" stroke-width="1" class="badge-pulse" />
    <circle cx="780" cy="15" r="3.5" fill="#06B6D4" />
    <text x="792" y="19" font-family="'Fira Code', monospace" font-size="10" fill="#F1F5F9" font-weight="700">RELIANCE JIO POS</text>
  </g>
</svg>
