<svg width="100%" height="90" viewBox="0 0 1000 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerBgNew" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="50%" stop-color="#0D1B2A" />
      <stop offset="100%" stop-color="#050B14" />
    </linearGradient>

    <linearGradient id="footerAccentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="1" />
      <stop offset="75%" stop-color="#818CF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </linearGradient>

    <filter id="fBlurNew" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .footer-quote-text {
      font-family: 'Fira Code', 'SF Mono', Consolas, monospace;
      font-size: 11.5px;
      letter-spacing: 1.8px;
      fill: #94A3B8;
      text-anchor: middle;
    }
    .footer-author-text {
      font-weight: 700;
      fill: #38BDF8;
    }
    .footer-exp-text {
      font-weight: 600;
      fill: #10B981;
    }
  </style>

  <!-- Background Base -->
  <rect x="2" y="2" width="996" height="86" rx="12" fill="url(#footerBgNew)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Top Accent Glowing Circuit -->
  <line x1="20" y1="1" x2="980" y2="1" stroke="url(#footerAccentLine)" stroke-width="2" filter="url(#fBlurNew)" />

  <!-- Corner Marks -->
  <path d="M 14 22 L 14 12 L 24 12" stroke="#38BDF8" stroke-width="1.5" fill="none" />
  <path d="M 986 22 L 986 12 L 976 12" stroke="#38BDF8" stroke-width="1.5" fill="none" />
  <path d="M 14 68 L 14 78 L 24 78" stroke="#38BDF8" stroke-width="1.5" fill="none" />
  <path d="M 986 68 L 986 78 L 976 78" stroke="#38BDF8" stroke-width="1.5" fill="none" />

  <!-- Center Quote -->
  <text x="500" y="40" class="footer-quote-text">
    "ENGINEERING SECURE, ZERO-DOWNTIME CLOUD INFRASTRUCTURE &amp; AUTOMATED CI/CD."
  </text>
  <text x="500" y="60" class="footer-quote-text">
    <tspan class="footer-author-text">&#8212; ASHISH PANDEY &#8226; </tspan>
    <tspan class="footer-exp-text">SENIOR DEVOPS ENGINEER @ RELIANCE INDUSTRIES</tspan>
    <tspan class="footer-author-text"> &#8212;</tspan>
  </text>
</svg>
